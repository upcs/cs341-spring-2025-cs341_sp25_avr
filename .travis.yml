language: node_js
node_js:
  - "18"
os: linux

install:
  - npm install
  - npm --prefix initialApp install

script:
  - npm run coverage

after_script:
  - npx codecov -f coverage/lcov.info || echo "Frontend coverage upload skipped"
  - npx --prefix initialApp codecov -f initialApp/coverage/lcov.info || echo "Coverage upload skipped"


